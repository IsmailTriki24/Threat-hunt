id: windows-persistence-sweep
title: Windows persistence sweep (ASEP overview)
summary: >-
  Broad first-pass sweep across Windows autostart mechanisms - tasks, services, run keys, Winlogon, IFEO, AppInit, COM, startup
  folder - to find which one an adversary used, then hand off to the specific playbook.
tactics: [persistence, privilege-escalation]
attack: [T1547.001, T1547.004, T1547.005, T1546.012, T1546.015, T1546.010, T1546.003]
sources:
  - hunting-for-persistence-mechanisms-in-windows
keywords: [persistence, autostart, asep, autoruns, appinit, ifeo, winlogon, com hijack, lsa, security support provider, persistence sweep]
signals: [persistence]
needs: [process_creation]
helps: [scheduled_task, service_install, file_event, registry_event]
hypothesis: >-
  A host was given a foothold that survives reboot through one of the Windows autostart extensibility points, visible as a
  persistence-tagged alert or as a configuration-changing command (reg, schtasks, sc, wmic) with a payload in a writable path.
steps:
  - purpose: scope
    goal: What persistence detections already fired.
    tool: search_events
    query: event_type:alert tags:attack.t1547*
    look_for: >-
      Sensor alerts tagged to boot or logon autostart (also try tags:attack.t1053*, attack.t1543*, attack.t1546*) and the host
      and user they point to.
  - purpose: test
    goal: Configuration utilities writing autostart data.
    tool: search_events
    query: process.name:*reg.exe* process.command_line:add process.command_line:run
    look_for: >-
      Values under Run, RunOnce, Winlogon, AppInit_DLLs, Image File Execution Options, or LSA security packages set by a shell or
      script host with a payload outside Program Files and Windows.
  - purpose: test
    goal: Tasks and services created in the same period.
    tool: search_events
    query: event_type:(scheduled_task|service_install)
    look_for: >-
      Rare or random names, shell/script actions or temp-path binaries; hosts where several mechanisms appear in a short time are
      the strongest hit.
  - purpose: test
    goal: COM hijack and DLL-based persistence set up from the command line.
    tool: search_events
    query: process.command_line:inprocserver32
    look_for: A per-user CLSID InprocServer32 value pointing at a DLL in AppData or Temp; regsvr32 /i or rundll32 with a user path.
  - purpose: refute
    goal: Which parents run persistence-style utilities.
    tool: aggregate_events
    query: process.name:*reg.exe*
    field: process.parent.name
    look_for: Installers and endpoint managers explain most; rare parents or single-host events remain for follow-up.
benign:
  - Installers and updaters (browsers, collaboration and VPN clients) add run values, tasks and services during setup or update.
  - Group Policy, SCCM/Intune and EDR agents change autostart settings in bulk.
  - Developers using IFEO debuggers or registering COM components for testing.
escalate:
  - "Open the matching playbook (scheduled-task-persistence, service-installation-persistence, registry-run-key-persistence, startup-folder-persistence, or wmi-event-subscription-persistence.)"
  - Pivot on the payload path or hash across hosts and on the writing account.
confirm: >-
  Confirmed when at least one autostart entry points to an unknown or writable-path payload AND was written by a non-installer
  process, ideally with a second mechanism or a first execution at the next boot or logon.
gaps:
  - No registry_event telemetry, so Run, Winlogon, IFEO, AppInit and LSA changes can be seen only when made through reg.exe or PowerShell.
  - The upstream Autoruns baseline comparison and offline hive analysis cannot be reproduced.
