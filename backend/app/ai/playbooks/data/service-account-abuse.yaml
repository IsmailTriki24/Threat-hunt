id: service-account-abuse
title: Service account misuse
summary: >-
  Hunt service accounts (svc_, sql, backup, scan) used interactively, from new hosts, or outside their fixed purpose,
  including interactive and RDP logons and shells spawned under them.
tactics: [persistence, privilege-escalation, lateral-movement]
attack: [T1078.002, T1078]
sources:
  - detecting-service-account-abuse
keywords: [service account, svc, interactive logon, rdp, logon type 10, logon type 2, valid accounts, non-interactive, batch, sql service]
signals: [lateral_movement]
needs: [authentication]
helps: [process_creation, alert]
hypothesis: >-
  A service account whose logons are normally type 5 (service) or 4/3 from fixed servers is being used by a person or tool, shown as
  interactive (2/10/11) logons, logons from workstations, or shells and recon commands under that identity.
steps:
  - purpose: test
    goal: Interactive or remote-interactive logons by service-named accounts.
    tool: search_events
    query: event_type:authentication outcome:success auth.logon_type:(2|10|11|interactive|remoteinteractive|cachedinteractive) user.name:*svc*
    look_for: Service accounts logging on at the console or via RDP. Repeat with user.name:*service*, *sql*, *backup* or the tenant's naming convention.
  - purpose: test
    goal: What programs service accounts run - shells and recon tools (cmd, powershell, net, whoami, nltest) are the signal.
    tool: aggregate_events
    query: user.name:*svc* event_type:process_creation
    field: process.name
    look_for: Recon (whoami /all, net group, nltest), reg or sc commands, or encoded PowerShell by an account that should only run its service.
  - purpose: test
    goal: Source hosts of the account's network logons.
    tool: aggregate_events
    query: event_type:authentication outcome:success user.name:*svc*
    field: auth.source_ip
    look_for: A source that is not a known application server (a workstation or new IP) suggests the credential is used elsewhere.
  - purpose: refute
    goal: Compare against the account's usual pattern and failures.
    tool: aggregate_events
    query: event_type:authentication user.name:*svc*
    field: auth.logon_type
    look_for: A stable logon type mix (5, 3, 4) is normal; the first appearance of 2, 10 or 11, or bursts of failure before a success, is not.
  - purpose: follow_up
    goal: What did the account do after the first anomalous logon?
    tool: events_around
    look_for: Service or task creation, privilege use, membership changes, access to data stores, onward logons to other servers.
benign:
  - Administrators logging on with a service account to troubleshoot an application, under a ticket or break-glass process.
  - Installation or patching of the application by deployment accounts, and RDP-hosted legacy apps designed for one shared account.
  - Scheduled tasks using batch (type 4) logons, which are expected for those accounts.
escalate:
  - Pivot on the account across hosts (pivot_entity on user.name) and check kerberoasting and credential dumping on the first host.
  - Review recent membership or password changes on the account (see account-manipulation-t1098).
confirm: >-
  Confirmed when a service account shows interactive or new-source activity AND performs actions outside its application role, with no
  administrative record. A single interactive logon is only suspicious.
gaps:
  - No account inventory or owner mapping, so service accounts are identified by naming convention only.
  - Token/Kerberos delegation and SPN details are unavailable.
