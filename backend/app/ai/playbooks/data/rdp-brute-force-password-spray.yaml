id: rdp-brute-force-password-spray
title: RDP brute force and password spraying
summary: >-
  Hunt bursts of failed logons against RDP/network logon, one source against many users or one user from many sources, and a
  successful logon that follows the failures.
tactics: [credential-access, initial-access]
attack: [T1110.001, T1110.003, T1021.001]
sources:
  - detecting-rdp-brute-force-attacks
keywords: [rdp, brute force, password spray, failed logon, "4625", logon type 10, nla, credential guessing, remote desktop, spraying]
signals: [failed_auth]
needs: [authentication]
helps: [network_connection, alert]
hypothesis: >-
  A single external or internal source is guessing credentials against RDP or network logon, producing many failures across users or
  hosts, and may have succeeded once the failures stop.
steps:
  - purpose: test
    goal: Which sources produce the most failed logons.
    tool: aggregate_events
    query: event_type:authentication outcome:failure
    field: auth.source_ip
    look_for: A few IPs with hundreds of failures. Internal scanners and misconfigured hosts also appear; external or unknown sources are most suspect.
  - purpose: test
    goal: Targeted users - spraying versus brute force.
    tool: aggregate_events
    query: event_type:authentication outcome:failure auth.logon_type:(3|10|network|remoteinteractive)
    field: user.name
    look_for: Many users with few failures each from the same source is spraying; one user with many failures is brute force. Administrator, admin and svc names are common targets.
  - purpose: test
    goal: Success after failures from the same source.
    tool: search_events
    query: event_type:authentication outcome:success auth.logon_type:(10|remoteinteractive)
    look_for: Remote-interactive logons from a source address that appeared in the failure list (compare auth.source_ip); then pivot_entity on the source.
  - purpose: refute
    goal: Spread across targets, to exclude lockouts of one broken service.
    tool: aggregate_events
    query: event_type:authentication outcome:failure
    field: host.hostname
    look_for: A stale password on one service or scheduled job hits one host repeatedly from one internal IP; attacks fan out across hosts or users.
  - purpose: follow_up
    goal: What happened after the successful logon?
    tool: events_around
    look_for: Discovery commands, tool downloads, new accounts or scheduled tasks within minutes of the first success.
benign:
  - Users mistyping passwords after a forced reset, or a mobile device with an old password hitting repeatedly.
  - A service or scheduled task with an expired password that fails every cycle.
  - Internal vulnerability scanners and monitoring probes that test logons.
escalate:
  - Pivot on the source IP for all hosts and accounts contacted (pivot_entity on auth.source_ip), and block or geolocate externally.
  - Check each account that succeeded from the source for MFA, recent password change and later activity.
confirm: >-
  Confirmed when failures from one source span many attempts (spray or brute force) AND a success from that source follows, with
  post-logon activity not consistent with the user. Failures alone indicate attempted, not successful, access.
gaps:
  - Failure reason (sub-status 0xC000006A vs 0xC0000064), NLA vs non-NLA and workstation name are not fields.
  - Thresholds in the upstream rules (such as 10 failures per window) cannot be set by the query; use aggregate counts and judgement. NLA failures logged on the host may be absent.
