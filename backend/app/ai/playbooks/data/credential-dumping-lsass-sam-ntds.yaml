id: credential-dumping-lsass-sam-ntds
title: OS credential dumping (LSASS, SAM, NTDS.dit, Mimikatz)
summary: >-
  Hunt tools and living-off-the-land methods that pull credentials out of LSASS memory, registry hives or the AD database -
  Mimikatz modules, procdump/comsvcs MiniDump against lsass, reg save of SAM, ntdsutil/vssadmin shadow copies.
tactics: [credential-access]
attack: [T1003, T1003.001, T1003.002, T1003.003]
sources:
  - detecting-mimikatz-execution-patterns
  - detecting-t1003-credential-dumping-with-edr
  - detecting-credential-dumping-techniques
keywords: [mimikatz, lsass, credential dumping, sekurlsa, minidump, procdump, ntds.dit, ntdsutil, sam hive, logonpasswords, vssadmin, shadow copy]
signals: [cred_access]
needs: [process_creation]
helps: [alert, file_event, authentication]
hypothesis: >-
  An intruder with local admin or SYSTEM on a host is extracting credential material (LSASS memory, SAM/SYSTEM hives or NTDS.dit),
  visible as Mimikatz module strings, a dump tool pointed at lsass, or hive/shadow-copy export commands, followed by new logons using
  the stolen accounts.
steps:
  - purpose: test
    goal: Mimikatz module names on any command line.
    tool: search_events
    query: process.command_line:sekurlsa
    look_for: >-
      sekurlsa logonpasswords, lsadump sam/dcsync, kerberos list/ptt, privilege debug. Repeat with lsadump, logonpasswords and
      mimikatz as the token. Any hit outside a documented red-team exercise is high confidence.
  - purpose: test
    goal: LSASS dumped through a legitimate tool (comsvcs MiniDump, procdump, Task Manager).
    tool: search_events
    query: process.command_line:minidump
    look_for: >-
      rundll32 comsvcs.dll MiniDump <lsass pid> <file> full. Repeat with token procdump plus lsass. Dump files written to Temp, Public
      or ProgramData are suspicious.
  - purpose: test
    goal: Registry hive export or shadow-copy based theft of SAM / NTDS.dit.
    tool: search_events
    query: process.command_line:ntdsutil
    look_for: >-
      ntdsutil ifm / "activate instance ntds", vssadmin or wmic shadowcopy create, reg save of sam/system/security hives. Repeat with
      tokens vssadmin, shadowcopy, ntds. On non-DCs, any NTDS reference is anomalous.
  - purpose: test
    goal: EDR detections already raised for credential access.
    tool: search_events
    query: event_type:alert tags:attack.t1003*
    look_for: Trend Vision One credential-access detections; take host, user and process from the alert and pivot there.
  - purpose: refute
    goal: Who runs these binaries; is it a known admin or backup/EDR tool?
    tool: aggregate_events
    query: process.command_line:procdump
    field: host.hostname
    look_for: One tool on a few hosts under a named admin or support account suggests troubleshooting; many hosts or a service account does not.
  - purpose: follow_up
    goal: What happened on the host right after the dump?
    tool: events_around
    look_for: >-
      New network (type 3) or RDP logons from this host using other accounts, archive/compress of the dump file, outbound transfer,
      or deletion of the dump.
benign:
  - Microsoft Support or developers capturing a procdump of an application crash (target is the app, not lsass).
  - Endpoint security and backup agents that read lsass or create shadow copies (VSS backups, Veeam, EDR sensors).
  - Domain controller IFM/ntdsutil snapshots run by AD admins for build or DR, from a change ticket.
  - Authorized red-team or pentest tools (Mimikatz strings in a scheduled engagement).
escalate:
  - Pivot on the user and host to find where the stolen accounts log on next (pivot_entity on user.name, auth.source_ip).
  - If NTDS or DCSync indicators are present, run the DCSync and Kerberos forged-ticket playbooks (krbtgt exposure).
  - Process lineage of the dumping process to find the initial execution path.
confirm: >-
  Confirmed when a dump or module command targets lsass/SAM/NTDS AND the executing account or host has no administrative reason,
  corroborated by an EDR alert, a dump file written, or new logons with the exposed credentials. A single tool name alone is only suspicious.
gaps:
  - Sysmon Event 10 (ProcessAccess to lsass, GrantedAccess 0x1010/0x1410) and 4656/4663 handle auditing are not queryable, so memory access without a command line is invisible.
  - Registry and file-hash telemetry is sparse; hive exports are seen only through command lines.
