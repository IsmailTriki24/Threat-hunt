[project]
name = "threat-hunt-backend"
version = "0.1.0"
description = "Threat Hunting & Investigation Platform — backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "opensearch-py[async]>=2.6",
  "arq>=0.26",
  "prometheus-client>=0.20",
  "email-validator>=2.1",
  "orjson>=3.10",
  "cryptography>=42",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10", "pip-audit", "bandit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/seed/*" = ["S311"]
"app/detections/*" = ["E501", "S105"]
"app/ai/*" = ["E501"]
"app/events/search/local.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
