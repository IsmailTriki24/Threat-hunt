name: threat-hunt

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  OPENSEARCH_URL: http://opensearch:9200
  JWT_SECRET: ${JWT_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  SEED_PASSWORD: ${SEED_PASSWORD:-}
  CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
  # Outbound policy for pull connectors: public hosts are always allowed; private ones only when listed here.
  OUTBOUND_ALLOWED_NETWORKS: ${OUTBOUND_ALLOWED_NETWORKS:-}
  OUTBOUND_ALLOWED_PORTS: ${OUTBOUND_ALLOWED_PORTS:-80,443,8080,8443,9200}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      # DEV ONLY: security plugin disabled so the stack boots without certificates.
      # The port is published on loopback only. See SECURITY.md for production hardening.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "false"
      # DEV ONLY: small dev disks otherwise trip the flood-stage watermark and make indices read-only.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - osdata:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    # Chainguard build of MinIO (the upstream minio/minio image is no longer published on Docker Hub).
    image: chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  # One-shot: run migrations, provision OpenSearch templates, optionally seed demo data.
  init:
    build: ./backend
    command: ["python", "-m", "app.cli", "init"]
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment: *backend-env
    depends_on:
      init: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *backend-env
    depends_on:
      init: {condition: service_completed_successfully}

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
